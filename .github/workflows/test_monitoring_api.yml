name: Test Monitoring API

on:
  push:
    branches: [ main, feature/DataDrifting ]
  pull_request:

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra cpu

      - name: Pull Data & Model (DVC)
        shell: bash
        env:
          GCS_KEY_CONTENT: ${{ secrets.GCS_DOCKER_IMAGES_KEY }}
        run: |
          # 1. Create key file for DVC
          echo "$GCS_KEY_CONTENT" > gcs_key.json
          
          # 2. Configure and Pull
          uv run dvc remote modify --local storage credentialpath gcs_key.json
          uv run dvc pull
          
          # Note: We keep gcs_key.json because the API might need it below

      - name: Start API and Run Tests
        env:
          ENABLE_DATA_COLLECTION: "True"
          GCS_BUCKET_NAME: "group114-bucket"
          GOOGLE_APPLICATION_CREDENTIALS: "gcs_key.json"
          MODEL_PATH: "models/model_20260118_135410_FT_True.pth" 
        run: |
          # 1. Start the API in the background
          # CRITICAL FIX: We use 'src.mlopsproject.api:app' because your file is in src/mlopsproject/api.py
          nohup uv run uvicorn src.mlopsproject.api:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          
          # 2. Wait 10 seconds for the server to boot up
          echo "Waiting for API to start..."
          sleep 10
          
          # 3. Create a Python script to test the endpoints
          cat <<EOF > test_monitoring.py
          import requests
          import sys
          import time
          from PIL import Image
          import io

          # Create a simple dummy image
          img = Image.new('RGB', (224, 224), color='red')
          buf = io.BytesIO()
          img.save(buf, format='JPEG')
          img_bytes = buf.getvalue()

          print("--- Testing Task 2: Data Collection (/predict) ---")
          try:
              files = {'file': ('test.jpg', img_bytes, 'image/jpeg')}
              res = requests.post("http://localhost:8000/predict", files=files)
              if res.status_code == 200:
                  print("[PASS] Prediction successful.")
              else:
                  print(f"[FAIL] Predict returned {res.status_code}: {res.text}")
                  # Print server logs to see why it failed
                  sys.exit(1)
          except Exception as e:
              print(f"[FAIL] Could not connect to /predict: {e}")
              sys.exit(1)

          print("\n--- Testing Task 3: Drift API (/drift) ---")
          time.sleep(2)
          try:
              res = requests.get("http://localhost:8000/drift")
              if res.status_code == 200:
                  print("[PASS] Drift API returned a report.")
              else:
                  print(f"[FAIL] Drift API returned {res.status_code}: {res.text}")
                  sys.exit(1)
          except Exception as e:
              print(f"[FAIL] Could not connect to /drift: {e}")
              sys.exit(1)
          
          print("\nALL MONITORING TESTS PASSED")
          EOF
          
          # 4. Run the test script
          uv run python test_monitoring.py

      - name: Show Server Logs (On Failure)
        if: failure()
        run: cat server.log

      - name: Cleanup
        if: always()
        run: rm -f gcs_key.json