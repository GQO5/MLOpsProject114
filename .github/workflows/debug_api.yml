name: Debug API Crash

on:
  push:
    branches: [ main, feature/DataDrifting ]
  workflow_dispatch:

jobs:
  debug-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --extra cpu
          uv add evidently pandas fastjson

      - name: Pull Data & Model (DVC)
        shell: bash
        env:
          GCS_KEY_CONTENT: ${{ secrets.GCS_DOCKER_IMAGES_KEY }}
        run: |
          echo "$GCS_KEY_CONTENT" > gcs_key.json
          uv run dvc remote modify --local storage credentialpath gcs_key.json
          uv run dvc pull

      - name: 🔍 Debug - Verify Model Exists
        run: |
          echo "Listing models directory (Check if filename matches MODEL_PATH):"
          ls -R models/

      - name: 💥 Nuclear Start - Force Error to Show
        env:
          ENABLE_DATA_COLLECTION: "True"
          GCS_BUCKET_NAME: "group114-bucket"
          GOOGLE_APPLICATION_CREDENTIALS: "gcs_key.json"
          # CRITICAL: Ensure this filename matches exactly what 'ls -R models/' outputs above!
          MODEL_PATH: "models/model_20260118_135410_FT_True.pth"
          PYTHONPATH: "."  # <--- CRITICAL FIX 1: Helps Python find 'src'
        run: |
          echo "Attempting to start API..."
          # CRITICAL FIX 2: Point to the correct module path 'src.mlopsproject.api:app'
          timeout 10s uv run uvicorn src.mlopsproject.api:app --host 0.0.0.0 --port 8000 || true