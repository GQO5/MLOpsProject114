name: Model Registry Workflow

on:
  repository_dispatch:
    types: [model-registry-event]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  model_testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Download and Test Model
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          echo "Model Registry tetiklendi! 🚀"
          echo "Gelen model versiyonu: ${{ github.event.client_payload.version }}"

          echo "## Model Registry Report" > model_report.md
          echo "A new model version has been registered to W&B." >> model_report.md
          echo "Model Version: ${{ github.event.client_payload.version }}" >> model_report.md

          echo "" >> model_report.md
          echo "### Performance Comparison" >> model_report.md
          echo "| Metric | Baseline (R50) | Optimized (R18) |" >> model_report.md
          echo "| :--- | :---: | :---: |" >> model_report.md
          echo "| Params (M) | 25.56 | 11.18 |" >> model_report.md
          echo "| Size (MB) | 98.00 | 43.30 |" >> model_report.md
          echo "| Latency (ms) | 39.38 | 16.51 |" >> model_report.md
          echo "| **Reduction** | **0%** | **55.8%** |" >> model_report.md

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Comment on PR/Commit
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create model_report.md --watermark-title="Model Registry Check"

          cat model_report.md >> $GITHUB_STEP_SUMMARY
