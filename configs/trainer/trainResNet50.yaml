defaults:
  - _self_

# Passed to train()
train:
  total_epochs: 1
  validation_interval: 10

# Passed to class instance arguments
init:
  _target_: train.Food101ResNet50
  criterion:
    _target_: torch.nn.MSELoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.01
    weight_decay: 0.005
  scheduler:
    _target_: torch.optim.lr_scheduler.StepLR
    _partial_: true
    step_size: 1
    gamma: 0.975
  finetune: True
