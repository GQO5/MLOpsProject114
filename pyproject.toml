[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopsproject"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Team_114", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "datasets==3.2.0",
  "matplotlib==3.10.0",
  "numpy==2.2.0",
  "tqdm==4.67.1",
  "typer==0.15.2",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
]
optional-dependencies = {dev = [
  "invoke==2.2.0",
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "coverage==7.8.0",
  "ruff==0.11.6",
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.1",
  "mkdocstrings-python==1.16.10",
]}

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "N", "E", "W", ]

[tool.coverage.run]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pytest>=8.3.4",
]
