[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopsproject"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Team_114", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "datasets==3.2.0",
  "matplotlib==3.10.0",
  "numpy==2.2.0",
  "tqdm==4.67.1",
  "typer==0.15.2",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "hydra-core>=1.3.2",
  "wandb>=0.24.0",
]
[project.optional-dependencies]
dev = [
  "invoke==2.2.0",
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "coverage==7.8.0",
  "ruff==0.11.6",
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.1",
  "mkdocstrings-python==1.16.10",
]

cpu = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]
cu128 = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "N", "E", "W", ]
ignore = ["I001"]

[tool.coverage.run]
omit = [
  "tests/*",
  "tmp/*"
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.3.0",
]