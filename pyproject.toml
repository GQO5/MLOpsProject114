[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mlopsproject"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Team_114", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "invoke==2.2.0",
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "datasets==3.2.0",
  "matplotlib==3.10.0",
  "numpy==2.2.0",
  "tqdm==4.67.1",
  "typer==0.15.2",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "hydra-core>=1.3.2",
  "wandb>=0.24.0",
  "streamlit>=1.53.0",
  "bentoml>=1.4.19",
  "google-cloud-run>=0.14.0",
  "locust>=2.43.1",
  "dvc>=3.66.1",
  "dvc-gs>=3.0.2",
  "mypy[dev]>=1.19.1",
  "loguru>=0.7.3",
  "markdown>=3.10",
  "google-cloud-storage>=3.8.0",
]
[project.optional-dependencies]
dev = [

  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "coverage==7.8.0",
  "ruff==0.11.6",
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.1",
  "mkdocstrings-python==1.16.10",
]

cpu = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]
cu128 = [
  "torch>=2.9.1",
  "torchvision>=0.24.1",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]

required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128",  marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu",  marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128",  marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

# This tells mypy to ignore errors for libraries that don't have types yet
ignore_missing_imports = true 

check_untyped_defs = true      # Check inside functions even if they aren't fully typed
disallow_untyped_defs = false  # Allow functions without type hints (good for adoption)

[tool.ruff.lint]
select = ["I", "N", "E", "W", ]
ignore = ["I001"]

[tool.coverage.run]
omit = [
  "tests/*",
  "tmp/*",
  "*/_remote_module_non_scriptable.py"
]


[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.3.0",
    "types-markdown>=3.10.0.20251106",
    "types-requests>=2.32.4.20260107",
    "types-tqdm>=4.67.0.20250809",
]
